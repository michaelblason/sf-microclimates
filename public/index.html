<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SF Microclimate Map</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: #fafafa;
        color: #1a1a1a;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      /* ── Legend card (top-left, fixed) ── */
      .legend {
        position: fixed;
        top: 24px;
        left: 24px;
        width: 230px;
        padding: 18px 20px;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(8px);
        border-radius: 12px;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
        z-index: 10;
      }
      .legend h1 {
        margin: 0 0 2px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .legend .sub {
        margin: 0 0 14px;
        font-size: 11px;
        color: #888;
      }
      .bar {
        height: 12px;
        border-radius: 4px;
        /* Must match RAMP in the script: blue → green → yellow → orange */
        background: linear-gradient(
          to right,
          #3b82f6 0%,
          #22c55e 34%,
          #facc15 67%,
          #f97316 100%
        );
        border: 1px solid rgba(0, 0, 0, 0.06);
        margin-bottom: 4px;
      }
      .ticks {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: #666;
        font-variant-numeric: tabular-nums;
        margin-bottom: 14px;
      }
      .meta {
        margin: 0;
        font-size: 10px;
        color: #888;
        line-height: 1.6;
      }
      .meta b {
        color: #555;
        font-weight: 500;
      }
      .meta a {
        color: #8b5cf6;
        text-decoration: none;
        border-bottom: 1px solid rgba(139, 92, 246, 0.35);
      }
      .meta a:hover {
        border-bottom-color: #8b5cf6;
      }

      /* ── Map ── */
      .map {
        position: relative;
        width: min(75vh, 75vw);
        aspect-ratio: 1;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 4px 28px rgba(0, 0, 0, 0.08);
        background: #cde0ee;
      }
      .map canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      .map svg.labels {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .map svg.labels text {
        font-family: inherit;
        font-size: 1.7px;
        font-weight: 600;
        fill: rgba(0, 0, 0, 0.72);
        text-anchor: middle;
        dominant-baseline: middle;
        paint-order: stroke;
        stroke: rgba(255, 255, 255, 0.85);
        stroke-width: 0.22;
        stroke-linejoin: round;
      }

      /* ── Mobile: stack, legend becomes static ── */
      @media (max-width: 720px) {
        body {
          flex-direction: column;
          justify-content: flex-start;
          padding: 16px;
        }
        .legend {
          position: static;
          width: 100%;
          max-width: 400px;
          margin-bottom: 16px;
        }
        .map {
          width: min(90vw, 90vh);
        }
      }
    </style>
  </head>
  <body>
    <aside class="legend">
      <h1>SF Microclimate Map</h1>
      <p class="sub">Current temperature by neighborhood</p>
      <div class="bar"></div>
      <div class="ticks" id="ticks"><span>—</span><span>—</span><span>—</span></div>
      <p class="meta" id="meta">Loading…</p>
    </aside>

    <div class="map">
      <canvas id="canvas" width="100" height="100"></canvas>
      <svg class="labels" id="labels" viewBox="0 0 100 100"></svg>
    </div>

    <script>
      (async function () {
        const meta = document.getElementById("meta");
        let data;
        try {
          const res = await fetch("data.json", { cache: "no-store" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          data = await res.json();
        } catch (err) {
          meta.innerHTML =
            "<b>No data available yet.</b><br>" +
            "Run <code>python scripts/generate_data.py</code> then redeploy.";
          console.error("Failed to load data.json:", err);
          return;
        }
        const { cols, rows, minTemp, maxTemp, temps, labels, sources, generated } = data;

        // ── Legend ticks follow the actual data range ──
        const loT = Number.isFinite(minTemp) ? minTemp : 50;
        const hiT = Number.isFinite(maxTemp) ? maxTemp : 70;
        const fmtT = (v) =>
          (Number.isInteger(v) ? String(v) : v.toFixed(1)) + "°F";
        document.getElementById("ticks").innerHTML =
          `<span>${fmtT(loT)}</span>` +
          `<span>${fmtT((loT + hiT) / 2)}</span>` +
          `<span>${fmtT(hiT)}</span>`;

        // ── Blue → Green → Yellow → Orange (cold → hot) ──
        // Stops are interpolated linearly, so the scale works for any range.
        const RAMP = [
          [0.0,  [59, 130, 246]], // #3b82f6 blue
          [0.34, [34, 197, 94]],  // #22c55e green
          [0.67, [250, 204, 21]], // #facc15 yellow
          [1.0,  [249, 115, 22]], // #f97316 orange
        ];

        function colorFor(t) {
          if (t == null) return [205, 224, 238]; // water
          const r = Math.max(0, Math.min(1, (t - minTemp) / (maxTemp - minTemp)));
          for (let i = 1; i < RAMP.length; i++) {
            if (r <= RAMP[i][0]) {
              const [p0, c0] = RAMP[i - 1];
              const [p1, c1] = RAMP[i];
              const k = (r - p0) / (p1 - p0);
              return [
                Math.round(c0[0] + k * (c1[0] - c0[0])),
                Math.round(c0[1] + k * (c1[1] - c0[1])),
                Math.round(c0[2] + k * (c1[2] - c0[2])),
              ];
            }
          }
          return RAMP[RAMP.length - 1][1];
        }

        // ── Render grid on canvas at native 100×100 ──
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const img = ctx.createImageData(cols, rows);
        const buf = img.data;
        for (let i = 0; i < temps.length; i++) {
          const [r, g, b] = colorFor(temps[i]);
          const p = i * 4;
          buf[p] = r;
          buf[p + 1] = g;
          buf[p + 2] = b;
          buf[p + 3] = 255;
        }
        ctx.putImageData(img, 0, 0);

        // ── Labels as SVG overlay (scales with map) ──
        const svg = document.getElementById("labels");
        const NS = "http://www.w3.org/2000/svg";
        for (const { r, c, name, temp } of labels) {
          const el = document.createElementNS(NS, "text");
          el.setAttribute("x", c + 0.5);
          el.setAttribute("y", r + 0.5);
          el.textContent = name;
          // Hover info for truncated names
          const title = document.createElementNS(NS, "title");
          title.textContent = temp != null ? `${name} — ${temp}°F` : name;
          el.appendChild(title);
          svg.appendChild(el);
        }

        // ── Meta info ──
        const dt = new Date(generated).toLocaleString(undefined, {
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit",
        });
        const s = sources || {};
        const lines = [];
        if (s.provider) {
          const name = /open-meteo/i.test(s.provider)
            ? '<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>'
            : s.provider;
          lines.push(
            `<b>Source:</b> ${name}` + (s.model ? ` · ${s.model}` : "")
          );
        }
        if (s.samplePoints != null) {
          lines.push(
            `<b>Samples:</b> ${s.samplePoints} points` +
              (s.spacingM ? ` @ ~${s.spacingM} m` : "")
          );
        }
        if (s.elevationMin != null && s.elevationMax != null) {
          lines.push(`<b>Elevation:</b> ${s.elevationMin}–${s.elevationMax} m`);
        }
        lines.push(`<b>Updated:</b> ${dt}`);
        meta.innerHTML = lines.join("<br>");
      })();
    </script>
  </body>
</html>
