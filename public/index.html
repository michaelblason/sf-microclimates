<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SF Microclimate Map</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: #fafafa;
        color: #1a1a1a;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      /* ── Legend card (top-left, fixed) ── */
      .legend {
        position: fixed;
        top: 24px;
        left: 24px;
        width: 230px;
        padding: 18px 20px;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(8px);
        border-radius: 12px;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
        z-index: 10;
      }
      .legend h1 {
        margin: 0 0 2px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .legend .sub {
        margin: 0 0 14px;
        font-size: 11px;
        color: #888;
      }
      .bar {
        height: 12px;
        border-radius: 4px;
        background: linear-gradient(to right, #8b5cf6, #ffffff, #f97316);
        border: 1px solid rgba(0, 0, 0, 0.06);
        margin-bottom: 4px;
      }
      .ticks {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: #666;
        font-variant-numeric: tabular-nums;
        margin-bottom: 14px;
      }
      .meta {
        margin: 0;
        font-size: 10px;
        color: #888;
        line-height: 1.6;
      }
      .meta b {
        color: #555;
        font-weight: 500;
      }

      /* ── Map ── */
      .map {
        position: relative;
        width: min(75vh, 75vw);
        aspect-ratio: 1;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 4px 28px rgba(0, 0, 0, 0.08);
        background: #cde0ee;
      }
      .map canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      .map svg.labels {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .map svg.labels text {
        font-family: inherit;
        font-size: 1.7px;
        font-weight: 600;
        fill: rgba(0, 0, 0, 0.72);
        text-anchor: middle;
        dominant-baseline: middle;
        paint-order: stroke;
        stroke: rgba(255, 255, 255, 0.85);
        stroke-width: 0.22;
        stroke-linejoin: round;
      }

      /* ── Mobile: stack, legend becomes static ── */
      @media (max-width: 720px) {
        body {
          flex-direction: column;
          justify-content: flex-start;
          padding: 16px;
        }
        .legend {
          position: static;
          width: 100%;
          max-width: 400px;
          margin-bottom: 16px;
        }
        .map {
          width: min(90vw, 90vh);
        }
      }
    </style>
  </head>
  <body>
    <aside class="legend">
      <h1>SF Microclimate Map</h1>
      <p class="sub">Current temperature by neighborhood</p>
      <div class="bar"></div>
      <div class="ticks"><span>50°F</span><span>60°F</span><span>70°F</span></div>
      <p class="meta" id="meta">Loading…</p>
    </aside>

    <div class="map">
      <canvas id="canvas" width="100" height="100"></canvas>
      <svg class="labels" id="labels" viewBox="0 0 100 100"></svg>
    </div>

    <script>
      (async function () {
        const meta = document.getElementById("meta");
        let data;
        try {
          const res = await fetch("data.json", { cache: "no-store" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          data = await res.json();
        } catch (err) {
          meta.innerHTML =
            "<b>No data available yet.</b><br>" +
            "Run <code>python scripts/generate_data.py</code> then redeploy.";
          console.error("Failed to load data.json:", err);
          return;
        }
        const { cols, rows, minTemp, maxTemp, temps, labels, sources, generated } = data;

        // ── Purple → White → Orange ──
        function colorFor(t) {
          if (t == null) return [205, 224, 238]; // water
          const r = Math.max(0, Math.min(1, (t - minTemp) / (maxTemp - minTemp)));
          let cr, cg, cb;
          if (r < 0.5) {
            const k = r / 0.5; // purple → white
            cr = 139 + k * (255 - 139);
            cg = 92 + k * (255 - 92);
            cb = 246 + k * (255 - 246);
          } else {
            const k = (r - 0.5) / 0.5; // white → orange
            cr = 255 + k * (249 - 255);
            cg = 255 + k * (115 - 255);
            cb = 255 + k * (22 - 255);
          }
          return [cr | 0, cg | 0, cb | 0];
        }

        // ── Render grid on canvas at native 100×100 ──
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const img = ctx.createImageData(cols, rows);
        const buf = img.data;
        for (let i = 0; i < temps.length; i++) {
          const [r, g, b] = colorFor(temps[i]);
          const p = i * 4;
          buf[p] = r;
          buf[p + 1] = g;
          buf[p + 2] = b;
          buf[p + 3] = 255;
        }
        ctx.putImageData(img, 0, 0);

        // ── Labels as SVG overlay (scales with map) ──
        const svg = document.getElementById("labels");
        const NS = "http://www.w3.org/2000/svg";
        for (const { r, c, name } of labels) {
          const el = document.createElementNS(NS, "text");
          el.setAttribute("x", c + 0.5);
          el.setAttribute("y", r + 0.5);
          el.textContent = name;
          // Hover info for truncated names
          const title = document.createElementNS(NS, "title");
          title.textContent = name;
          el.appendChild(title);
          svg.appendChild(el);
        }

        // ── Meta info ──
        const dt = new Date(generated).toLocaleString(undefined, {
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit",
        });
        document.getElementById("meta").innerHTML =
          `<b>Microclimates:</b> ${sources.microclimate} stations<br>` +
          `<b>Open-Meteo:</b> ${sources.openmeteo} stations<br>` +
          `<b>Updated:</b> ${dt}`;
      })();
    </script>
  </body>
</html>
